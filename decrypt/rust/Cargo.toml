[package]
name = "secret_crypto"
version = "1.0.0"
edition = "2021"
description = "Descifra los valores generados con SecretEncryptor"
license = "MIT"

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
chacha20poly1305 = "0.10"
des = "0.8"
hmac = "0.12"
sha2 = "0.10"
